[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mir"
version = "0.2.0"
description = "Преобразование piano-visualizer-видео в читаемый нотный лист"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TToJlkoBHuK" }]

dependencies = [
    "yt-dlp>=2024.1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-html>=4.1",
    "mypy>=1.8",
    "ruff>=0.3",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]

[project.scripts]
mir-ingest = "scripts.ingest_cli:main"

[tool.setuptools.packages.find]
include = ["mir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers --tb=short --durations=5"
markers = [
    "requires_ffmpeg: нужен установленный FFmpeg",
    "requires_gpu: нужна видеокарта с CUDA",
    "requires_musescore: нужен установленный MuseScore",
    "requires_network: обращается к сети",
]

[tool.coverage.run]
source = ["mir"]
omit = ["*/tests/*"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
show_error_codes = true
exclude = ["build/", "core/"]

[[tool.mypy.overrides]]
module = ["yt_dlp.*", "tomli.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "core", "site"]

[tool.ruff.lint]
# PLW1514 (чтение и запись файлов без явной кодировки) пока в preview.
# Правило важное: Windows — целевая платформа (NF-11), а там кодировка
# по умолчанию не UTF-8, и русский текст падает с UnicodeEncodeError.
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "D", "PLW1514"]
ignore = [
    "D203",   # конфликтует с D211
    "D213",   # конфликтует с D212
    "D105",   # magic-методы описаны в докстринге класса
    "D107",   # аргументы __init__ описаны в докстринге класса
    "RUF001", # кириллица в строках — это нормально для проекта
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]
"scripts/*" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"
