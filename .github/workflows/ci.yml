name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Проверки качества
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установить FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Установить зависимости
        run: pip install -e ".[dev]"

      - name: Линтер (ruff)
        run: ruff check mir tests scripts

      - name: Форматирование
        run: ruff format --check mir tests scripts

      - name: Типизация (NF-16)
        run: mypy mir

      - name: Тесты с покрытием (NF-17)
        run: pytest tests --cov=mir --cov-report=term-missing --cov-report=xml

      - name: Выгрузить покрытие
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  windows:
    name: Проверка на Windows (NF-11)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить FFmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Установить зависимости
        run: pip install -e ".[dev]"

      - name: Тесты
        run: pytest tests -q

  docs:
    name: Сборка документации
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -e ".[docs]"

      - name: Собрать сайт
        run: mkdocs build --strict

      - name: Сохранить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site/

  publish-docs:
    name: Публикация документации
    runs-on: ubuntu-latest
    needs: docs
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -e ".[docs]"

      - name: Опубликовать на GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
