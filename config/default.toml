# Значения по умолчанию. Ни одно из этих чисел не должно быть
# продублировано в коде (NF-18). Обоснование порогов — в config/README.md.

[ingest]
max_height = 1080          # выше смысла нет: клавиатура различима, время растёт
prefer_fps = 60            # 16 мс между кадрами вместо 33 при 30 fps
timeout_sec = 300
cache_dir = "~/.mir_cache"
cache_max_gb = 20.0
proxy_mode = "auto"        # auto: прямое соединение, при неудаче — автопоиск прокси
proxy = ""                 # заполняется только при proxy_mode = "manual"
audio_sample_rate = 16000  # требование модели транскрипции ByteDance
audio_channels = 1
retries = 3

[vision.keyboard]
sample_frames = 90
min_key_width_px = 4.0
black_key_height_ratio = 0.6

[vision.tracker]
on_threshold = 0.25
off_threshold = 0.15       # ниже on_threshold: это гистерезис против дребезга
min_frames_on = 2
velocity_gamma = 0.7
min_note_duration = 0.06  # короче — обрывок блока, а не нота

[audio]
# Нейросетевая транскрипция (#26)
device = "auto"            # auto: видеокарта, если есть и хватает памяти, иначе процессор
batch_size = 1             # сегментов по 10 с за проход; на CPU больше 1 только тратит память
model_path = ""            # пусто: веса скачиваются в кэш при первом запуске
onset_threshold = 0.3      # пороги постобработки модели ByteDance — значения авторов
offset_threshold = 0.3
frame_threshold = 0.1
pedal_offset_threshold = 0.2

# Атаки звука (#28)
hop_length = 128           # 8 мс при 16 кГц
onset_n_fft = 1024         # окно 64 мс: вдвое меньше задержка и разброс, чем при 2048
onset_delta = 0.07         # порог выбора пиков, значение librosa по умолчанию
onset_wait = 0.03          # атаки ближе 30 мс сливаются в одну
refine_max_shift = 0.05    # дальше допуска MIREX ноту не двигаем
chord_window = 0.03        # атаки ближе — один аккорд, а не две ноты подряд

# Темп (#27)
min_bpm = 40.0
max_bpm = 220.0
beat_tightness = 50.0      # 100 у librosa: не успевает за ускорением 90→130 BPM
beat_match_tolerance = 0.07  # доля «совпала с атакой», если ближе 70 мс
min_tempo_confidence = 0.5 # ниже — предупредить и предложить задать темп вручную
tempo_ioi_min_beats = 0.25 # типичная нота не короче шестнадцатой...
tempo_ioi_max_beats = 1.0  # ...и не длиннее четверти, иначе темп ошибся вдвое
default_beats_per_bar = 4  # предварительно; размер определяет этап 5 (#33)

[fusion]
onset_tolerance = 0.08
max_av_offset = 1.0
min_offset_confidence = 0.3
offset_resolution = 0.002  # шаг поиска рассинхрона; пик уточняется параболой
offset_smoothing = 0.015   # разброс времени атаки в видеоканале — около трети кадра
min_offset_pairs = 8       # меньше совпавших пар — сдвиг не оценивается
duration_weight = 0.3
octave_artifact_ratio = 0.8

[notation]
quantize_strength = 0.7
max_subdivision = 16
allow_triplets = true
min_duration_beats = 0.0625
hand_split_pitch = 60
dynamics_window_beats = 4.0

[export]
ppq = 480
page_size = "A4"
staff_size_mm = 7.0
show_measure_numbers = true
